openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /calendars/import:
    post:
      operationId: importCalendar
      summary: Fetch a public iCalendar feed for a one-time browser import
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarLink"
      responses:
        "200":
          description: Public iCalendar content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarFeed"
        "400":
          description: Invalid, inaccessible, or unsupported calendar link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarImportError"
        "429":
          description: Too many imports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarImportError"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    CalendarLink:
      type: object
      required: [url]
      properties:
        url:
          type: string
          minLength: 1
          maxLength: 4096
    CalendarFeed:
      type: object
      required: [content]
      properties:
        content:
          type: string
          maxLength: 1048576
    CalendarImportError:
      type: object
      required: [error]
      properties:
        error:
          type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

